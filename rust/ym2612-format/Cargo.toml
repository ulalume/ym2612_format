[package]
name = "ym2612-format"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "YM2612 FM instrument format parsing and conversion"
repository = "https://github.com/ulalume/ym2612_format"
links = "ym2612_format"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
